<style>
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1d1a17;--paper:#fbf7ee;--suit:#f07a1a;--night:#1f2a44;--red:#d8261c;--yel:#ffd23a;
  --pop:'RocknRoll One','Hiragino Sans','Yu Gothic',sans-serif;--body:'M PLUS 1p','Hiragino Sans','Yu Gothic',sans-serif;
  --top:max(8px,env(safe-area-inset-top));--bot:max(10px,env(safe-area-inset-bottom));
}
html{background:var(--night);touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere}
body{overflow:hidden;background:var(--night);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

img{-webkit-user-drag:none;user-select:none;pointer-events:none}
:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
.view{position:fixed;inset:0;z-index:10;height:100svh;overflow:hidden}

/* ロード画面: まぶたが開いたり閉じたり。バーはまぶたの開き */
#boot{position:fixed;inset:0;z-index:90;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;--p:0;transition:opacity .35s;color:var(--paper)}
#boot.out{opacity:0}
#boot svg{width:min(200px,52vw);height:auto;overflow:visible}
#boot .lid{transform-origin:50% 0;transform:scaleY(calc(1 - var(--p) * .85));animation:blink 2.4s ease-in-out infinite}
@keyframes blink{0%,86%,100%{opacity:1}92%{opacity:.6}}
#boot .zz{font-family:var(--pop);font-size:22px;animation:zz 1.6s ease-in-out infinite;fill:#9fb3df}
@keyframes zz{50%{transform:translate(4px,-6px)}}
#boot p{font-size:15px;font-weight:800;letter-spacing:.12em}

#corner{position:fixed;top:var(--top);right:max(8px,env(safe-area-inset-right));z-index:40;display:flex;gap:6px}
#corner button{height:40px;min-width:44px;padding:0 9px;border:1.5px solid rgba(251,247,238,.55);border-radius:20px;background:rgba(20,26,44,.72);color:var(--paper);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
#corner svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
body.playing #corner{display:none}

/* タイトル: セミナーのポスター */
#vTitle{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:calc(var(--top) + 52px) 16px calc(var(--bot) + 6px);background:radial-gradient(120% 70% at 70% 30%,#33467a 0,#1f2a44 60%,#141b2e 100%)}
.poster{position:relative;width:min(400px,100%);flex:1;min-height:0;max-height:640px;background:#ffe9c8;border:3px solid var(--ink);box-shadow:0 16px 30px rgba(0,0,0,.45);overflow:hidden;transform:rotate(-1deg)}
.poster::before{content:'';position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 72% 46%,#ffd9a0 0 8deg,#ffe9c8 8deg 16deg)}
.poster .gimg{position:absolute;right:-2%;bottom:0;height:86%;filter:drop-shadow(4px 6px 0 rgba(0,0,0,.25))}

.poster .tag{position:absolute;left:12px;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.poster h1{font-family:var(--pop);font-weight:400;font-size:min(10.6vw,5.4vh,44px);line-height:1.08;color:var(--ink);text-shadow:3px 3px 0 #fff;max-width:68%}
.poster h1 em{font-style:normal;color:var(--red);font-size:1.32em}
.poster .en{font-family:var(--pop);font-size:12px;letter-spacing:.18em;background:var(--ink);color:#ffe9c8;padding:2px 8px}
.poster .lead{font-size:clamp(11px,1.8svh,13px);font-weight:800;line-height:1.5;max-width:60%;background:rgba(255,255,255,.82);padding:5px 7px;border-left:4px solid var(--suit)}
.poster .book{background:var(--red);color:#fff;font-weight:800;font-size:12px;padding:4px 8px;transform:rotate(-4deg);margin-top:4px;max-width:62%}
.tBtns{width:min(400px,100%);display:flex;flex-direction:column;gap:8px}
.go{min-height:60px;border-radius:30px;background:var(--suit);color:#fff;font-family:var(--pop);font-size:22px;letter-spacing:.08em;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.sub{min-height:44px;border-radius:22px;border:1.5px solid rgba(251,247,238,.6);background:transparent;color:var(--paper);font-size:15px;font-weight:800}

/* 遊び方: 先生の講演レジュメ */
#vHow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(var(--top) + 52px) 16px calc(var(--bot) + 6px)}
.inst{width:min(440px,100%);background:var(--paper);padding:14px 16px 10px;border-top:8px solid var(--suit);box-shadow:0 12px 28px rgba(0,0,0,.4);min-height:0;overflow:hidden}

/* プレイ */
#vPlay{display:flex;flex-direction:column;background:#000}
.topbar{position:relative;z-index:5;display:flex;align-items:stretch;gap:8px;padding:calc(var(--top) + 2px) max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));background:var(--night);height:calc(var(--top) + 60px)}
.memo{width:96px;flex:none;background:#fffdf4;border:2px solid var(--ink);padding:3px 6px 2px;transform:rotate(-2deg);position:relative;background-image:repeating-linear-gradient(180deg,transparent 0 13px,#b9cbe0 13px 14px)}

.memo .marks{display:flex;gap:3px;align-items:center;height:26px}

.sched b{font-family:var(--pop);font-weight:400;font-size:clamp(14px,4.4vw,18px);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.sched span{font-size:12px;font-weight:800;opacity:.85;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.dayline{display:flex;gap:3px;margin-top:4px}.dayline i{width:12px;height:4px;border-radius:2px;background:rgba(251,247,238,.25)}.dayline i.d{background:var(--suit)}.dayline i.n{background:var(--paper)}
.phone{width:98px;flex:none;background:#111;border-radius:12px;border:2px solid #444;padding:4px 7px;color:#fff;display:flex;flex-direction:column;justify-content:center;position:relative;margin-right:0}
.phone .ph{font-size:9px;font-weight:800;opacity:.75}
.phone b{font-family:var(--pop);font-weight:400;font-size:17px;line-height:1.15}
.phone .dlt{position:absolute;right:6px;top:2px;font-size:11px;font-weight:800}
.phone.down{animation:shk .4s}.phone .dlt.m{color:#ff6b5e}.phone .dlt.p{color:#7fe08a}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

#stage{position:relative;flex:1;min-height:0;overflow:hidden;container-type:size}
.bg{position:absolute;inset:0}
.spr{position:absolute;bottom:0;transform-origin:50% 100%;will-change:transform}
.spr img{display:block;height:100%;width:auto;filter:drop-shadow(3px 5px 0 rgba(0,0,0,.28))}

#guru.awake img{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.2%) rotate(-.6deg)}}
.w{z-index:3}
.w::before{content:'';position:absolute;left:-6%;right:-6%;bottom:-1%;height:13%;background:#4a3428;border:2.5px solid #1d1a17;border-radius:8px 8px 2px 2px;z-index:1;box-shadow:inset 0 3px 0 rgba(255,255,255,.18)}
.w img{position:relative;z-index:0}
.w.turn img{animation:tw .35s ease-in-out infinite alternate}
@keyframes tw{to{transform:translateY(-3%) rotate(2deg)}}
.w.zzz::after,#guru.deep::after{content:'Zz';position:absolute;top:2%;right:-6%;font-family:var(--pop);font-size:6cqh;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;animation:zz 1.4s ease-in-out infinite}
.mark{position:absolute;z-index:6;font-family:var(--pop);color:var(--yel);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;font-size:8cqh;line-height:1;pointer-events:none;transform:translate(-50%,-100%)}
.mark{white-space:nowrap}.mark.q{color:#fff;font-size:4.6cqh;animation:pop .35s ease-in-out infinite alternate}
@keyframes pop{to{transform:translate(-50%,-112%) scale(1.12)}}
#fxl{position:absolute;inset:0;z-index:8;pointer-events:none}
#beams{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;overflow:visible}
.cam,.phonecam{position:absolute;bottom:0;z-index:3}
.cam svg,.phonecam svg{display:block;height:100%;width:auto;overflow:visible;filter:drop-shadow(3px 5px 0 rgba(0,0,0,.3))}
.tally{fill:#5a1410}.cam.turn .tally{animation:tb .22s steps(1) infinite}.cam.look .tally,.cam.caught .tally{fill:#ff2a1a}
@keyframes tb{50%{fill:#ff2a1a}}
.cam .tglow{opacity:0}.cam.look .tglow,.cam.caught .tglow{opacity:.75}
.phonecam .rec{opacity:.25}.phonecam.look .rec,.phonecam.caught .rec{opacity:1}.phonecam.turn .rec{animation:tb2 .22s steps(1) infinite}
@keyframes tb2{50%{opacity:1}}
.phonecam .freeze{opacity:0}.phonecam.away .freeze,.phonecam.turn .freeze{opacity:1}
.sign{position:absolute;z-index:2;font-weight:800;pointer-events:none}
.bub{position:absolute;z-index:2;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:4px 10px;font-weight:800;font-size:clamp(13px,3.6cqw,17px);white-space:nowrap;transform:translate(-50%,-100%);pointer-events:none}
.bub::after{content:"";position:absolute;left:var(--tx,50%);bottom:-10px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--ink);border-bottom:0}
.bub.g{background:#fff7e6}

.ono{position:absolute;z-index:7;font-family:var(--pop);white-space:nowrap;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;font-size:clamp(20px,6cqw,30px);line-height:1;pointer-events:none;transform:translate(-50%,-50%)}
#flash{position:absolute;inset:0;z-index:9;background:#fff;opacity:0;pointer-events:none}

#slow.on{opacity:1}
#trendTag{position:absolute;left:50%;top:10%;transform:translateX(-50%) rotate(-3deg);z-index:9;background:#111;color:#fff;font-weight:800;padding:6px 12px;border-radius:6px;white-space:nowrap;font-size:clamp(14px,4cqw,18px);pointer-events:none}

/* 手帳（場面の間） */
#card{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:rgba(10,14,26,.55);pointer-events:none}
.page{width:min(300px,78%);background:#fffdf4;border:2px solid var(--ink);padding:12px 14px 10px;transform:rotate(-2deg);box-shadow:0 12px 26px rgba(0,0,0,.45);background-image:repeating-linear-gradient(180deg,transparent 0 25px,#c7d6e8 25px 26px);animation:pg .45s cubic-bezier(.2,.9,.3,1)}
@keyframes pg{from{transform:translateY(40px) rotate(4deg);opacity:0}}
.page h3{font-size:12px;font-weight:800;color:#6b6152;margin-bottom:4px}
.page li{list-style:none;display:flex;gap:10px;font-weight:800;font-size:15px;line-height:26px;color:#9a917f}
.page li b{width:3.2em;font-family:var(--pop);font-weight:400}
.page li.d{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--red)}
.page li.n{color:var(--ink);font-size:18px}
.page li.n::after{content:'';flex:1;border-bottom:3px solid var(--suit);margin-bottom:6px}

/* 下: 腕時計・目・言い訳 */
.ctrl{position:relative;z-index:6;flex:none;height:calc(clamp(118px,18svh,156px) + var(--bot));padding:6px max(8px,env(safe-area-inset-right)) var(--bot) max(8px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px;background:linear-gradient(#26314f,#1a2238)}
.watch{width:27%;max-width:112px;flex:none;align-self:center;position:relative}
.watch svg{width:100%;height:auto;display:block;overflow:visible}
.watch .face{fill:#0e1116}
.watch .wt{font-family:var(--pop);fill:#cfe3ff}
.watch.warn .face{fill:#5a4a00}.watch.warn .wt{fill:var(--yel)}
.watch.buzz{animation:vib .07s linear infinite}.watch.buzz .face{fill:#b3160e}.watch.buzz .wt{fill:#fff}
@keyframes vib{50%{transform:translateX(2px) rotate(2deg)}}
#eye{flex:1;height:100%;max-height:150px;border-radius:50%/42%;background:transparent;display:flex;align-items:center;justify-content:center;touch-action:none;position:relative}
#eye svg{width:100%;height:100%;overflow:visible}
#eye .lidU{transition:transform .08s linear}
#eye.hold .lidU{transform:translateY(0)!important}
#eye .vein{opacity:0;transition:opacity .3s}
#eye .ring{fill:none;stroke:rgba(255,255,255,.18);stroke-width:3}
#eye.hold .ring{stroke:#9fb3df}
#eye .elab{font-weight:800;fill:#cfd8ee;font-size:12px}
@keyframes exb{to{transform:scale(1.07) rotate(-2deg)}}
.hint{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px);background:var(--paper);color:var(--ink);padding:6px 12px;font-size:15px;font-weight:800;border:2px solid var(--ink);border-radius:8px;pointer-events:none;text-align:center;z-index:20}
#finger{position:absolute;width:46px;height:46px;pointer-events:none;z-index:21;animation:tap .7s ease-in-out infinite alternate}
@keyframes tap{to{transform:translate(4px,8px) scale(.94)}}
#bMuteP{position:absolute;right:max(6px,env(safe-area-inset-right));top:-46px;width:40px;height:40px;border-radius:20px;background:rgba(20,26,44,.6);color:var(--paper);display:flex;align-items:center;justify-content:center;z-index:7}
#bMuteP svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}


/* v2: 見る人の名札・合図・付箋・配信コメント・カメラマンの指 */
.nm{position:absolute;left:50%;bottom:1%;transform:translateX(-50%);z-index:4;background:var(--ink);color:#fbf7ee;font-size:11px;font-weight:800;line-height:1.35;padding:0 6px;border-radius:8px;white-space:nowrap;pointer-events:none;border:1.5px solid #fbf7ee}
.cam .nm,.phonecam .nm{bottom:-1%}
.w.glow::after{content:'';position:absolute;left:24%;top:4%;width:60%;height:46%;z-index:2;pointer-events:none;background:radial-gradient(closest-side,rgba(200,245,255,.95),rgba(160,230,255,.45) 55%,rgba(160,230,255,0));animation:gl .25s ease-in-out infinite alternate}
@keyframes gl{to{opacity:.55}}
.w.rustle img{animation:rs .1s steps(2) infinite}
@keyframes rs{50%{transform:translateX(2.5%) rotate(1.5deg)}}
.w.fiddle img{animation:fd .3s ease-in-out infinite alternate}
@keyframes fd{to{transform:rotate(-2deg) translateY(-1%)}}
.w.fidget img{animation:fg .16s ease-in-out infinite alternate}
@keyframes fg{to{transform:translateX(5%) rotate(5deg)}}
.hand{position:absolute;left:74%;top:-30%;width:40%;pointer-events:none}.hand svg{display:block;width:100%;height:auto;animation:pop .2s ease-in-out infinite alternate}
.chat{position:absolute;left:3%;top:15%;width:47%;z-index:6;display:flex;flex-direction:column;gap:3px;pointer-events:none}
.chat p{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(10,12,24,.7);color:#fff;font-size:12px;font-weight:800;padding:1px 7px;border-radius:7px}
.chat p.h{background:#d8261c;font-size:13px}
.tip{position:absolute;z-index:3;transform:translate(-50%,-100%) rotate(-3deg);background:#fff27a;color:var(--ink);border:2px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.35);padding:3px 9px 4px;font-size:13px;font-weight:800;line-height:1.3;white-space:nowrap;pointer-events:none;text-align:center}
.tip b{display:block;font-size:10px;color:#6b5a00}
.bub.mut{background:#ece6ff;font-style:italic}
.gl{position:absolute;left:39%;top:19.2%;width:38%;height:9%;pointer-events:none}.gl svg{display:block;width:100%;height:100%;overflow:visible}
#guru.fallen{transform:none!important;height:36%!important}
/* 言い訳の3択（吹き出し） */
#choices{position:absolute;left:3%;bottom:54px;width:64%;z-index:11;display:flex;flex-direction:column;gap:8px}
.chc{position:relative;min-height:48px;text-align:left;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:6px 14px;font-weight:800;font-size:clamp(14px,4.2cqw,17px);line-height:1.25;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:chIn .22s ease-out backwards}
.chc:nth-child(2){animation-delay:.05s}.chc:nth-child(3){animation-delay:.1s}
.chc::after{content:'';position:absolute;right:-13px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:12px solid var(--ink);border-right:0}
.chc:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35);background:var(--yel)}
.chc.kage{background:#ffe1dc}
@keyframes chIn{from{transform:translateX(-30px) scale(.9);opacity:0}}
/* 変装ボタン */
#item{width:29%;max-width:126px;flex:none;align-self:center;min-height:76px;border-radius:18px;background:#3b4566;color:#8e98b6;border:2.5px solid #56618a;font-weight:800;font-size:12px;line-height:1.2;padding:6px 4px 5px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#item .ic{width:58%;max-width:56px;opacity:.45}#item .ic svg{display:block;width:100%;height:auto}
#item .it{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#item .n{position:absolute;right:-4px;top:-8px;min-width:26px;height:22px;border-radius:11px;background:#56618a;color:#fff;font-size:12px;line-height:22px;padding:0 5px}
#item.has{background:#fbf7ee;color:var(--ink);border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}#item.has .ic{opacity:1}#item.has .n{background:var(--red)}
#item.has:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#item.on{background:var(--yel);color:var(--ink);border-color:var(--ink);animation:exb .4s ease-in-out infinite alternate}#item.on .ic{opacity:1}
.mag .quote{max-width:100%;display:flex;flex-direction:column;gap:4px}
.mag .quote div{background:#111;color:#fff;padding:3px 7px;transform:rotate(-1.5deg);max-width:100%}
.mag .quote span{display:block;font-size:9px;color:var(--yel);font-weight:800}
.mag .quote b{display:block;font-size:12px;line-height:1.25;font-weight:800}

/* 結果: 週刊誌の表紙 */
#vResult{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(var(--top) + 50px) 14px calc(var(--bot) + 6px);background:#2a2420}
.mag{position:relative;width:min(390px,100%);flex:0 1 auto;min-height:0;max-height:66svh;aspect-ratio:3/4;background:#fff;border:2px solid #000;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.mag .mast{position:absolute;left:0;right:0;top:0;height:13%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.mag .mast b{font-family:var(--pop);font-weight:400;font-size:min(8.4vw,6.2svh,34px);letter-spacing:.02em;white-space:nowrap}
html[lang=en] .mag .mast b{font-size:min(6.6vw,5svh,30px)}
.mag .mast span{font-size:11px;font-weight:800;text-align:right;line-height:1.2}
.mag .photo{position:absolute;left:0;right:0;top:13%;bottom:0;background:linear-gradient(180deg,#d9d2c3,#a89f8c)}
.mag .photo img{position:absolute;bottom:0;filter:grayscale(.15) contrast(1.05) drop-shadow(3px 4px 0 rgba(0,0,0,.25))}
.mag .head{position:absolute;left:8px;top:15%;width:62%;font-family:var(--pop);font-size:min(6.2vw,4.4svh,26px);line-height:1.18;color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill;transform:rotate(-2deg)}
.mag .head em{font-style:normal;color:var(--yel)}
.mag .low{position:absolute;left:8px;bottom:8px;right:36%;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.mag .facts{background:#fff;border:2px solid #000;padding:4px 8px;font-size:12px;font-weight:800;line-height:1.45;width:min(62%,230px)}
.mag .facts span{white-space:nowrap}
.mag .facts{width:100%}
.mag .facts div{display:flex;justify-content:space-between;gap:10px}
.mag .facts .big{font-size:14px;color:var(--red)}
.mag .facts s{color:#777}
.mag .side{max-width:100%;background:#000;color:#fff;font-size:11px;font-weight:800;padding:4px 6px;transform:rotate(3deg)}
.mag .stamp{position:absolute;right:8px;top:15%;width:27%;aspect-ratio:1;border-radius:50%;border:4px solid var(--red);color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg) scale(var(--s,1));background:rgba(255,255,255,.88);opacity:var(--o,1)}
.mag .stamp b{font-family:var(--pop);font-weight:400;font-size:min(13vw,8svh,52px);line-height:1}
.mag .stamp span{font-size:10px;font-weight:800;text-align:center;line-height:1.15;padding:0 4px}
.rBtns{width:min(390px,100%);display:flex;flex-direction:column;gap:7px;align-items:stretch}
.rRow{display:flex;gap:8px}.rRow>*{flex:1}
#bAgain{min-height:54px;border-radius:27px;background:var(--suit);color:#fff;font-family:var(--pop);font-size:20px;border:3px solid var(--ink);box-shadow:0 4px 0 #000}
#bAgain:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.ghost{min-height:44px;border-radius:22px;border:1.5px solid rgba(251,247,238,.6);color:var(--paper);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.ghost svg{width:16px;height:16px;fill:currentColor}
.tlink{min-height:40px;color:rgba(251,247,238,.75);font-size:13px;font-weight:800;text-decoration:underline}
#boot-err{position:fixed;inset:auto 8px 8px 8px;z-index:99;background:#fff;color:#b00;font:12px/1.4 monospace;white-space:pre-wrap;padding:10px;border-radius:8px}
</style>

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
  document.addEventListener('contextmenu',function(e){e.preventDefault()});
})();
// 起動失敗の保険。JS が動いたか（__jsUp）で判定し、読み込み中を失敗と出さない
(function(){
  var errs=[];
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__jsUp) return;
    var d=document.createElement('div');d.id='boot-err';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },8000);
})();
</script>
